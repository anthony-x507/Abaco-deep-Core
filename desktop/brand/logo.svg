<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="ABACO DEEP HARNES">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#16204A"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#22D3EE" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="120" x2="480" y2="120"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="0" y1="360" x2="480" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
  </g>

  <!-- Abstract "A" mark — two diagonal bars + horizontal crossbar, abacus-style beads -->
  <g transform="translate(240 240)" filter="url(#glow)">
    <!-- Left diagonal -->
    <path d="M -110 110 L 0 -130 L -32 -130 L -130 110 Z" fill="url(#mark)"/>
    <!-- Right diagonal -->
    <path d="M 110 110 L 32 -130 L 0 -130 L -12 110 Z" fill="url(#mark)" opacity="0.85"/>
    <!-- Crossbar -->
    <rect x="-78" y="20" width="156" height="14" rx="7" fill="#F8FAFC"/>
    <!-- Three abacus beads on crossbar -->
    <circle cx="-55" cy="27" r="11" fill="#22D3EE"/>
    <circle cx="0"   cy="27" r="11" fill="#A78BFA"/>
    <circle cx="55"  cy="27" r="11" fill="#F472B6"/>
  </g>
</svg>