<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="ABACO DEEP HARNES">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#16204A"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Stylised "A" — large triangular mark with internal crossbar triangle -->
  <g transform="translate(240 180)">
    <path d="M -120 200 L 0 -160 L 120 200 L 80 200 L 60 140 L -60 140 L -80 200 Z M -36 96 L 36 96 L 0 0 Z"
          fill="url(#mark)" stroke="#F8FAFC" stroke-width="2"/>

    <!-- "ABACO DEEP HARNES" headline inside the A -->
    <text x="0" y="74" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
          font-weight="900" font-size="22" fill="#F8FAFC"
          letter-spacing="2">ABACO</text>
    <text x="0" y="104" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
          font-weight="700" font-size="14" fill="#22D3EE"
          letter-spacing="3">DEEP HARNES</text>
  </g>

  <!-- Subtitle "DEEP HARNES" below the A -->
  <text x="240" y="380" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-weight="700" font-size="36" fill="#22D3EE"
        letter-spacing="8">DEEP HARNES</text>

  <!-- Tagline -->
  <text x="240" y="420" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-weight="500" font-size="14" fill="#94A3B8"
        letter-spacing="4">AGENTIC DESKTOP</text>
</svg>