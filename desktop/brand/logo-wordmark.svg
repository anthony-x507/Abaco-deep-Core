<?xml version="1.0" encoding="UTF-8"?>
<!--
  ABACO DEEP HARNES — Wordmark horizontal.
  Misma paleta y forma que logo.svg pero en formato horizontal
  para encabezados, README y firmas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="ABACO DEEP HARNES">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1B2548"/>
      <stop offset="100%" stop-color="#070A18"/>
    </linearGradient>
    <linearGradient id="plate-front2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3D6FB2"/>
      <stop offset="100%" stop-color="#0E2147"/>
    </linearGradient>
    <linearGradient id="plate-right2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2A4F87"/>
      <stop offset="100%" stop-color="#070C1F"/>
    </linearGradient>
    <linearGradient id="plate-left2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#D9A48B"/>
      <stop offset="35%" stop-color="#7A6A8B"/>
      <stop offset="100%" stop-color="#1B2548"/>
    </linearGradient>
    <linearGradient id="edge2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7989B0"/>
      <stop offset="50%" stop-color="#C9D3E8"/>
      <stop offset="100%" stop-color="#5A6488"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9CA8C8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="32" fill="url(#bg2)"/>

  <g transform="translate(180 180)">
    <path d="M -8 -130 L 8 -130 L 60 70 L 30 70 L 16 30 L -16 30 L -30 70 L -60 70 Z"
          fill="url(#plate-left2)" transform="translate(-60 0)"/>
    <path d="M -8 -130 L 8 -130 L 60 70 L 30 70 L 16 30 L -16 30 L -30 70 L -60 70 Z"
          fill="url(#plate-right2)" transform="translate(60 0) scale(-1 1)"/>
    <path d="M -8 -130 L 8 -130 L 60 70 L 30 70 L 16 30 L -16 30 L -30 70 L -60 70 Z"
          fill="url(#plate-front2)"/>
    <path d="M -16 30 L 16 30 L 0 -30 Z" fill="#0A1230"/>
    <path d="M -8 -130 L 68 110 L 28 110 L 22 80 L -22 80 L -28 110 L -68 110 Z"
          fill="none" stroke="url(#edge2)" stroke-width="2"/>
    <line x1="-50" y1="70" x2="50" y2="70" stroke="url(#edge2)" stroke-width="2"/>
    <line x1="-22" y1="80" x2="22" y2="80" stroke="url(#edge2)" stroke-width="2"/>
  </g>

  <g transform="translate(330 180)">
    <text x="0" y="-10" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif"
          font-weight="700" font-size="86" fill="url(#text-grad)" letter-spacing="6">ABACO</text>
    <text x="0" y="86" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif"
          font-weight="400" font-size="46" fill="#9CA8C8" letter-spacing="14">DEEP HARNES</text>
  </g>
</svg>
