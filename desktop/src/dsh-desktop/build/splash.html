<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      const splashTheme = new URLSearchParams(location.search).get('theme')
      document.documentElement.dataset.theme = splashTheme === 'dark' ? 'dark' : 'light'
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
    </script>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #f8f8f6; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        padding: 32px;
        text-align: center;
      }
      html[data-platform="windows"] main { padding-top: 70px; }
      .markFrame { display: grid; place-items: center; width: 196px; height: 196px; }
      .abaco-mark {
        display: grid;
        place-items: center;
        width: 120px;
        height: 120px;
        border-radius: 28px;
        background: linear-gradient(145deg, #1a1b1f 0%, #2a2d36 100%);
        color: #f4f5f7;
        font-size: 72px;
        font-weight: 750;
        letter-spacing: -0.06em;
        line-height: 1;
        box-shadow: 0 10px 28px rgba(20, 22, 28, 0.18);
        animation: abaco-blink 1.6s ease-in-out infinite;
      }
      @keyframes abaco-blink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.42; transform: scale(0.96); }
      }
      .title { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -0.02em; }
      .status { margin: -4px 0 0; color: #777a80; font-size: 13px; }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      :root[data-theme='dark'] body {
        color: #f3f4f6;
        background: #141416;
      }
      :root[data-theme='dark'] .abaco-mark {
        background: linear-gradient(145deg, #f3f4f6 0%, #d7dae2 100%);
        color: #141416;
        box-shadow: 0 0 18px rgba(111, 134, 255, 0.18);
      }
      :root[data-theme='dark'] .status {
        color: #9ca0a8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) body { color: #f3f4f6; background: #141416; }
        :root:not([data-theme]) .abaco-mark {
          background: linear-gradient(145deg, #f3f4f6 0%, #d7dae2 100%);
          color: #141416;
          box-shadow: 0 0 18px rgba(111, 134, 255, 0.18);
        }
        :root:not([data-theme]) .status { color: #9ca0a8; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="markFrame" aria-hidden="true">
        <div class="abaco-mark" title="Abaco">A</div>
      </div>
      <h1 class="title" id="title">Starting ABACO DEEP HARNES</h1>
      <p class="status" id="status">First launch may take a moment.</p>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith('zh')) {
        document.getElementById('title').textContent = '正在启动 ABACO DEEP HARNES'
        document.getElementById('status').textContent = '首次启动可能需要一点时间。'
      }
    </script>
  </body>
</html>
