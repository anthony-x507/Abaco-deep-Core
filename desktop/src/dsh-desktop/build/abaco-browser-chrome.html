<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      The chrome bar runs no page script: every control is wired by its preload
      (`abaco-browser-chrome.cjs`), so the document only needs its own styles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>ABACO DEEP HARNES browser</title>
    <style>
      :root {
        color-scheme: light;
        --chrome-surface: #f1f3f4;
        --chrome-border: rgba(32, 33, 36, 0.16);
        --chrome-label: #3c4043;
        --chrome-label-strong: #202124;
        --chrome-field: #ffffff;
        --chrome-field-border: rgba(32, 33, 36, 0.2);
        --chrome-hover: rgba(32, 33, 36, 0.09);
        --chrome-close-hover: rgba(217, 48, 37, 0.12);
        --chrome-close: #d93025;
        --chrome-mode-manual: #b3261e;
        --chrome-record: #d93025;
        --chrome-record-hover: rgba(217, 48, 37, 0.12);
        --chrome-focus: #4d6bfe;
      }
      /*
        Two ways to be dark, and they are not the same thing.

        `prefers-color-scheme` is what this document would do on its own — the
        right default before the main process has said anything, and the right
        answer if the browser is ever opened outside the Harness.

        `body[data-theme='dark'|'light']` is the *Harness's* choice, pushed on
        `abaco:browser:theme-changed`. It wins, because a user who picked dark
        inside the app must not get a white browser strip on a light desktop.
      */
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --chrome-surface: #202124;
          --chrome-border: rgba(255, 255, 255, 0.12);
          --chrome-label: #bdc1c6;
          --chrome-label-strong: #e8eaed;
          --chrome-field: #2b2c2f;
          --chrome-field-border: rgba(255, 255, 255, 0.16);
          --chrome-hover: rgba(255, 255, 255, 0.1);
          --chrome-close-hover: rgba(238, 119, 114, 0.16);
          --chrome-close: #ee7772;
          --chrome-mode-manual: #ee7772;
          --chrome-record: #ee7772;
          --chrome-record-hover: rgba(238, 119, 114, 0.16);
        }
      }
      body[data-theme='light'] {
        color-scheme: light;
        --chrome-surface: #f1f3f4;
        --chrome-border: rgba(32, 33, 36, 0.16);
        --chrome-label: #3c4043;
        --chrome-label-strong: #202124;
        --chrome-field: #ffffff;
        --chrome-field-border: rgba(32, 33, 36, 0.2);
        --chrome-hover: rgba(32, 33, 36, 0.09);
        --chrome-close-hover: rgba(217, 48, 37, 0.12);
        --chrome-close: #d93025;
        --chrome-mode-manual: #b3261e;
        --chrome-record: #d93025;
        --chrome-record-hover: rgba(217, 48, 37, 0.12);
      }
      body[data-theme='dark'] {
        color-scheme: dark;
        --chrome-surface: #202124;
        --chrome-border: rgba(255, 255, 255, 0.12);
        --chrome-label: #bdc1c6;
        --chrome-label-strong: #e8eaed;
        --chrome-field: #2b2c2f;
        --chrome-field-border: rgba(255, 255, 255, 0.16);
        --chrome-hover: rgba(255, 255, 255, 0.1);
        --chrome-close-hover: rgba(238, 119, 114, 0.16);
        --chrome-close: #ee7772;
        --chrome-mode-manual: #ee7772;
        --chrome-record: #ee7772;
        --chrome-record-hover: rgba(238, 119, 114, 0.16);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        user-select: none;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        height: 100%;
        padding: 0 10px;
        background: var(--chrome-surface);
        border-bottom: 1px solid var(--chrome-border);
      }
      /*
        F2 — window dragging.

        macOS is the only platform that needs this: the window is created with
        `frame: false` + `titleBarStyle: 'hidden'` there, so the only draggable
        surfaces are the ones a view declares. Windows and Linux keep a native
        frame (`frame: process.platform !== 'darwin'`), where the OS already
        provides the gesture and a synthetic drag region would only steal clicks.

        The strip covers the page across the whole window width, so without this
        the user cannot move the window at all while the browser is open. Every
        interactive control opts back out with `no-drag`; the title span and the
        bar's own background stay draggable on purpose.

        The 84px gutter kept for the traffic lights (below) is the belt to this
        brace: it is native titlebar area, so the window stays movable even in a
        region this property does not cover.
      */
      body[data-platform='darwin'] .bar {
        -webkit-app-region: drag;
      }
      body[data-platform='darwin'] .iconButton,
      body[data-platform='darwin'] .addressForm,
      body[data-platform='darwin'] .addressInput,
      body[data-platform='darwin'] .modeButton,
      body[data-platform='darwin'] .recordButton {
        -webkit-app-region: no-drag;
      }
      /* macOS keeps the native window buttons inside the content rect, so the
         strip leaves them their gutter instead of drawing controls under them. */
      body[data-platform='darwin'] .bar {
        padding-left: 84px;
      }
      .iconButton {
        appearance: none;
        flex: none;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        padding: 0;
        color: var(--chrome-label);
        background: transparent;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      .iconButton:hover:not(:disabled) {
        color: var(--chrome-label-strong);
        background: var(--chrome-hover);
      }
      .iconButton:disabled {
        opacity: 0.38;
        cursor: default;
      }
      .iconButton:focus-visible {
        outline: 2px solid var(--chrome-focus);
        outline-offset: -2px;
      }
      @keyframes abaco-browser-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Loading spinner. Its own element rather than a state on the reload
         glyph: the strip has to be able to say "this page is still loading"
         while the reload button keeps being a reload button. */
      .spinner {
        flex: none;
        width: 14px;
        height: 14px;
        margin: 0 2px;
        border-radius: 50%;
        border: 2px solid var(--chrome-border);
        border-top-color: var(--chrome-focus);
        animation: abaco-browser-spin 0.8s linear infinite;
      }
      .spinner[hidden] {
        display: none;
      }
      .addressForm {
        flex: 1 1 auto;
        min-width: 0;
        margin: 0 4px;
      }
      .addressInput {
        width: 100%;
        height: 28px;
        padding: 0 12px;
        color: var(--chrome-label-strong);
        background: var(--chrome-field);
        border: 1px solid var(--chrome-field-border);
        border-radius: 14px;
        font: inherit;
        font-size: 13px;
        user-select: text;
      }
      .addressInput::placeholder {
        color: var(--chrome-label);
      }
      .addressInput:focus {
        outline: none;
        border-color: var(--chrome-focus);
      }
      /* The page title, next to the address. It is deliberately *not* marked
         `no-drag`: the empty space around a short title is the strip's most
         convenient grab handle. */
      .pageTitle {
        flex: 0 1 auto;
        min-width: 0;
        max-width: 22ch;
        overflow: hidden;
        color: var(--chrome-label);
        font-size: 12px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .pageTitle:empty {
        display: none;
      }
      .closeButton:hover:not(:disabled) {
        color: var(--chrome-close);
        background: var(--chrome-close-hover);
      }
      /* F1 takeover switch: a pill whose colour and label both state ownership. */
      .modeButton {
        appearance: none;
        flex: none;
        height: 22px;
        padding: 0 9px;
        color: var(--chrome-label-strong);
        background: var(--chrome-hover);
        border: 1px solid var(--chrome-border);
        border-radius: 11px;
        font: inherit;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      .modeButton[data-mode='manual'] {
        color: var(--chrome-mode-manual);
        background: var(--chrome-close-hover);
        border-color: var(--chrome-mode-manual);
      }
      .modeButton:focus-visible {
        outline: 2px solid var(--chrome-focus);
        outline-offset: -2px;
      }
      /* F2 recorder. Idle it is a quiet ⏺; recording it is red, pulsing and
         accompanied by a live action count, because "am I being recorded?" is
         exactly the question a user must never have to guess at. */
      .recordButton {
        color: var(--chrome-label);
      }
      .recordButton:hover:not(:disabled) {
        color: var(--chrome-record);
        background: var(--chrome-record-hover);
      }
      .recordButton.is-recording {
        color: var(--chrome-record);
        background: var(--chrome-record-hover);
      }
      .recordButton.is-recording svg {
        animation: abaco-browser-pulse 1.4s ease-in-out infinite;
      }
      .recordButton[data-pending='true'] {
        opacity: 0.5;
      }
      @keyframes abaco-browser-pulse {
        50% {
          opacity: 0.35;
        }
      }
      .recordCount {
        flex: none;
        color: var(--chrome-record);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .recordCount[hidden] {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner,
        .recordButton.is-recording svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" role="toolbar" aria-label="ABACO browser">
      <button
        class="iconButton"
        id="abaco-browser-back"
        type="button"
        aria-label="Back"
        title="Back"
        disabled
      >
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
          <path
            d="M12.5 4.5 7 10l5.5 5.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        class="iconButton"
        id="abaco-browser-forward"
        type="button"
        aria-label="Forward"
        title="Forward"
        disabled
      >
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
          <path
            d="M7.5 4.5 13 10l-5.5 5.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        class="iconButton"
        id="abaco-browser-reload"
        type="button"
        aria-label="Reload"
        title="Reload"
      >
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
          <path
            d="M15.5 10a5.5 5.5 0 1 1-1.7-3.97"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <path
            d="M15.6 3.6v3.2h-3.2"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <form class="addressForm" id="abaco-browser-address-form" role="search">
        <input
          class="addressInput"
          id="abaco-browser-address"
          type="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          aria-label="Address"
          placeholder="Search or enter address"
        />
      </form>
      <!--
        F2 loading state. Own element (not a class on the reload button): the
        spinner has to be able to appear and disappear without the reload glyph
        changing meaning, and `aria-live` is what tells a screen reader that the
        page finished loading.
      -->
      <span
        class="spinner"
        id="abaco-browser-spinner"
        role="status"
        aria-live="polite"
        aria-label="Loading"
        title="Loading"
        hidden
      ></span>
      <!--
        F2 page title, next to the address — written by the preload from the
        same state push that carries the URL, so the two can never disagree.
      -->
      <span class="pageTitle" id="abaco-browser-title" title=""></span>
      <!--
        F2 recorder. ⏺ starts a recording of the user's actions; the same button
        stops it, and `#abaco-browser-record-count` is the live action count.
      -->
      <button
        class="iconButton recordButton"
        id="abaco-browser-record"
        type="button"
        aria-pressed="false"
        aria-label="Record browser actions"
        title="Record my actions in this page (F2 recorder)"
      >
        <svg viewBox="0 0 20 20" width="12" height="12" aria-hidden="true">
          <circle cx="10" cy="10" r="5" fill="currentColor" />
        </svg>
      </button>
      <span class="recordCount" id="abaco-browser-record-count" hidden></span>
      <!--
        F1 takeover switch. A word rather than a glyph: "who owns this page" is
        the one piece of strip state a user must be able to read at a glance
        while the agent is driving, and an icon cannot carry it. Its label,
        tooltip and `data-mode` are written by the preload.
      -->
      <button
        class="modeButton"
        id="abaco-browser-mode"
        type="button"
        data-mode="agent"
        aria-pressed="false"
        aria-label="Browser control mode"
        title="The agent may drive this page."
      >
        AGENT
      </button>
      <button
        class="iconButton closeButton"
        id="abaco-browser-close"
        type="button"
        aria-label="Close browser"
        title="Close browser"
      >
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
          <path
            d="m6 6 8 8m0-8-8 8"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </body>
</html>
