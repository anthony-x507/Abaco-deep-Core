<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      The chrome bar runs no page script: every control is wired by its preload
      (`abaco-browser-chrome.cjs`), so the document only needs its own styles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>ABACO DEEP HARNES browser</title>
    <style>
      :root {
        color-scheme: light;
        --chrome-surface: #f1f3f4;
        --chrome-border: rgba(32, 33, 36, 0.16);
        --chrome-label: #3c4043;
        --chrome-label-strong: #202124;
        --chrome-field: #ffffff;
        --chrome-field-border: rgba(32, 33, 36, 0.2);
        --chrome-hover: rgba(32, 33, 36, 0.09);
        --chrome-close-hover: rgba(217, 48, 37, 0.12);
        --chrome-close: #d93025;
        --chrome-focus: #4d6bfe;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --chrome-surface: #202124;
          --chrome-border: rgba(255, 255, 255, 0.12);
          --chrome-label: #bdc1c6;
          --chrome-label-strong: #e8eaed;
          --chrome-field: #2b2c2f;
          --chrome-field-border: rgba(255, 255, 255, 0.16);
          --chrome-hover: rgba(255, 255, 255, 0.1);
          --chrome-close-hover: rgba(238, 119, 114, 0.16);
          --chrome-close: #ee7772;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        user-select: none;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        height: 100%;
        padding: 0 10px;
        background: var(--chrome-surface);
        border-bottom: 1px solid var(--chrome-border);
      }
      /* macOS keeps the native window buttons inside the content rect, so the
         strip leaves them their gutter instead of drawing controls under them. */
      body[data-platform='darwin'] .bar {
        padding-left: 84px;
      }
      .iconButton {
        appearance: none;
        flex: none;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        padding: 0;
        color: var(--chrome-label);
        background: transparent;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      .iconButton:hover:not(:disabled) {
        color: var(--chrome-label-strong);
        background: var(--chrome-hover);
      }
      .iconButton:disabled {
        opacity: 0.38;
        cursor: default;
      }
      .iconButton:focus-visible {
        outline: 2px solid var(--chrome-focus);
        outline-offset: -2px;
      }
      .iconButton.is-loading svg {
        animation: abaco-browser-spin 1s linear infinite;
      }
      @keyframes abaco-browser-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .addressForm {
        flex: 1 1 auto;
        min-width: 0;
        margin: 0 4px;
      }
      .addressInput {
        width: 100%;
        height: 28px;
        padding: 0 12px;
        color: var(--chrome-label-strong);
        background: var(--chrome-field);
        border: 1px solid var(--chrome-field-border);
        border-radius: 14px;
        font: inherit;
        font-size: 13px;
        user-select: text;
      }
      .addressInput::placeholder {
        color: var(--chrome-label);
      }
      .addressInput:focus {
        outline: none;
        border-color: var(--chrome-focus);
      }
      .closeButton:hover:not(:disabled) {
        color: var(--chrome-close);
        background: var(--chrome-close-hover);
      }
      @media (prefers-reduced-motion: reduce) {
        .iconButton.is-loading svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" role="toolbar" aria-label="ABACO browser">
      <button
        class="iconButton"
        id="abaco-browser-back"
        type="button"
        aria-label="Back"
        title="Back"
        disabled
      >
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
          <path
            d="M12.5 4.5 7 10l5.5 5.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        class="iconButton"
        id="abaco-browser-forward"
        type="button"
        aria-label="Forward"
        title="Forward"
        disabled
      >
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
          <path
            d="M7.5 4.5 13 10l-5.5 5.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        class="iconButton"
        id="abaco-browser-reload"
        type="button"
        aria-label="Reload"
        title="Reload"
      >
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
          <path
            d="M15.5 10a5.5 5.5 0 1 1-1.7-3.97"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <path
            d="M15.6 3.6v3.2h-3.2"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <form class="addressForm" id="abaco-browser-address-form" role="search">
        <input
          class="addressInput"
          id="abaco-browser-address"
          type="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          aria-label="Address"
          placeholder="Search or enter address"
        />
      </form>
      <button
        class="iconButton closeButton"
        id="abaco-browser-close"
        type="button"
        aria-label="Close browser"
        title="Close browser"
      >
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
          <path
            d="m6 6 8 8m0-8-8 8"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </body>
</html>
