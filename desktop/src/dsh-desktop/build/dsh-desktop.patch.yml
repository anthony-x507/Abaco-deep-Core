# Keep the stock directory-picker (auto) row active: the native backend
# serves ctx.directoryPicker, so host-side consumers (host.pickDirectory,
# plugins reading the seam) work unmodified. The client surface keeps its
# Electron-dialog bridge via the client-ui patch in patches/.

# Disable the stock single-slot occupant before mounting Desktop's equivalent;
# two occupants cannot share either brand seat. The Desktop plugin preserves
# the stock conversation mark. The phone remains in the settings row because
# the public footer-action slot is a separate row. Window chrome geometry
# remains a native-shell concern.
- id: ui-brand-official
  disabled: true

- insert:
    - id: dsh-desktop-client-ui
      name: dsh-desktop-client-ui

    # DSH Desktop owns the fixed-target dsh-market installer and its lightweight
    # settings entry. After dshmarket is installed and Harness restarts, the
    # community plugin replaces the placeholder with its complete market UI.
    - id: dsh-desktop-market-installer
      name: dsh-desktop-market-installer

    # DSH PPT owns one direct PPTD workflow and one standard Composer client.
    # The package contains no Tencent editor runtime or SlideP route.
    - id: dsh-ppt-composer
      name: 'dsh-ppt-composer'
      config:
        root: !!js dshHomePath('kimi-ppt')

# dsh-market normally offers to restart its own Node process after mutations.
# The desktop shell has the real lifecycle authority, so keep that behavior off
# whenever the optional plugin is present in the composed profile.
- id: dsh-market
  inject: [desktopProfiles]
  config:
    profile: web
    allowRestart: false

# Harness creates the full Cordis HMR service after boot when no `hmr` service
# exists, and that service throws without Node's internal module loader —
# which a packaged Electron app cannot provide, so every signed macOS launch
# failed profile boot at that step. This row supplies the config-watching
# subset `watchUserPatches` actually needs; where the internals are reachable
# it stands aside and the real service loads unchanged.
- insert:
    - id: dsh-desktop-hmr-fallback
      name: dsh-desktop-hmr-fallback

# Preset package export and import. These two routes lived in a patch on
# dsh-host-apiproxy until 0.1.2-alpha.1 deleted that package; upstream ships no
# preset transfer of its own, so the capability moved into a desktop plugin
# that registers on the Connection fetch-route seam instead.
- insert:
    - id: dsh-desktop-preset-transfer
      name: dsh-desktop-preset-transfer

# ──────────────────────────────────────────────────────────────────────────
# ABACO DEEP HARNES additions
# ──────────────────────────────────────────────────────────────────────────
#
# Theme tokens come first so every other plugin can rely on the CSS custom
# properties (--abaco-bg-0, --abaco-accent-1, etc.).
- insert:
    - id: abaco-theme
      name: abaco-theme

# TTS / STT with multi-provider registry (Web Speech / OpenAI / Edge /
# ElevenLabs / Deepgram). Adds mic button to composer, speak button to AI
# messages, and a settings panel.
- insert:
    - id: abaco-voice
      name: abaco-voice

# Document upload with client-side text extraction (PDF / DOCX / TXT / MD /
# CSV / JSON / YAML). Injects upload button into composer, document cards
# above input.
- insert:
    - id: abaco-documents
      name: abaco-documents

# Agent activity indicator ("AGENTE TRABAJANDO") — shows while the agent is
# running/thinking and hides when idle. Registers one entry on
# conversation.session.header.actions (session scope) and reads
# SessionSnapshot.running via the standard useSession prop.
- insert:
    - id: abaco-agent-status
      name: abaco-agent-status

# Integrated browser (F0). Registers one launcher entry on the stock
# `sidebar.footer.action` list slot (root scope, declared by
# @deepseek-ai/dsh-client-ui-sidebar) whose click calls
# window.dshAbacoBrowser.open(). That bridge is the desktop preload's; it asks
# src/main/abaco-browser-controller.ts to mount the WebContentsView overlay
# (own session partition) on top of the main window, with a local chrome-bar
# child view carrying the address input.
- insert:
    - id: abaco-browser
      name: abaco-browser

# Layer 2 (durable memory) of the 3-layer context system. A host-plane row, so
# one faceted sidecar store under <DSH_HOME>/abaco-memory/ serves every agent
# and every preset. It registers the abaco_memory_set/get/forget/list tools and
# one dynamic system-prompt section ("abaco:durable-memory") whose `text` is a
# FUNCTION re-evaluated on each assembly — which is why the memory survives
# compaction: the compaction contract only ever replaces user/message surfaces,
# never the system prompt. Config is resolved in the plugin, not here: every
# default is the production one, and a bad value degrades to that default
# instead of failing the mount. Nothing is written to the session log.
- insert:
    - id: abaco-memory
      name: abaco-memory

# Layer 3 (delegation — keeping bulk OUT of the window). Host-plane, next to
# abaco-memory because it shares the tool registry and the `tools` injection.
# It owns the durable vault under <DSH_HOME>/abaco-memory/vault/ and the two
# interceptors that feed it: an `agent/pre-step` rewrite of oversized
# `subagent-settled` notices — the one path that never passes through
# `tools/post-execute` and therefore has no spill at all today, which is the
# main remaining leak — and a best-effort durable copy of huge tool results.
# It never rewrites what the model sees for tool results (the stock spill
# policy owns that, so listener order cannot matter) and never writes a session
# event: every artifact is 0600 sidecar text plus one line in vault/index.jsonl.
- insert:
    - id: abaco-vault
      name: abaco-vault

# Layer 1 of the 3-layer context system: the working window and its summary
# policy. `compaction-basic` freezes its policy at construction and reads it
# from its composition row, so the only supported way to change WHEN the agent
# summarizes (80% → 90% of the routed window), WHAT it keeps verbatim (16% → 12%)
# and HOW BIG the summary may be (8k tokens — the engine's own default, so it is
# not a delta) is to mount a preset whose row carries that config. This plugin
# installs the ABACO preset — the shipped `standard` composition with exactly
# those deltas plus the delegation and durable-memory persona — into the
# roster's USER preset root
# (`<DSH_HOME>/.agent-presets/abaco`, scanned by the stock `includeUserRoot`),
# then selects it once as the default and never again: a preset edited by hand,
# or one the person picked in the UI, is left alone. Host-plane row, so it also
# reaches the `agent-presets` roster's own settings namespace. Nothing is
# written into `node_modules`, so an engine upgrade cannot revert it.
- insert:
    - id: abaco-context
      name: abaco-context

# NOTE: abaco-brand, abaco-device-identity, abaco-cloud-sync, abaco-onboarding
# and abaco-experimental are TEMPORARILY DISABLED. Their host-half index.js
# assigned ctx.abacoBrand/ctx.abacoSync directly and read ctx['secureStore'],
# which Cordis rejects ("cannot set property ... without provide" / "cannot get
# property ... without inject") and broke the whole plugin tree at boot
# ("Startup recovery - plugin failed during startup"). They must be re-wired
# with ctx.provide(...)/inject before being re-enabled. voice and documents
# carry their own localStorage-backed fallbacks and do not depend on them.

# Layer 3 of the 3-layer context system, cheapest half: the stock spill policy
# already lifts an oversized tool result out of the window and leaves a preview
# plus an absolute, `read`-able locator and a `retrievalHint` in its place
# (dsh-spill-policy/lib/index.js:136-153). It ships configured at 50000 bytes —
# ~12k tokens of a single result, which is exactly the "basura" this policy
# exists to keep out. Lowering the bar to ~3k tokens means the model keeps the
# head of a big `bash`/`web_fetch`/`grep` result and can pull the rest back with
# `read`/`grep` when it actually needs it. `read` and nested calls are excluded
# by the policy itself, so this cannot become a read → spill → read loop. The
# durable vault for the same content (a copy under `$DSH_HOME`, surviving
# reboots) is Layer 3's own plugin and lands separately.
- id: spill-policy
  config:
    maxInlineBytes: 12000

